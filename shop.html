<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Gian Hàng - Chợ Nhanh Diễn Châu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .shop-banner {
            background: linear-gradient(135deg, #ee4d2d, #ff7337);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .shop-banner h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        textarea.form-control {
            resize: vertical;
            height: 60px;
        }
        #img-preview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 6px;
            display: none;
            border: 1px solid #ddd;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn-upload {
            border: 2px dashed #ee4d2d;
            color: #ee4d2d;
            background-color: #fff5f2;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 13px;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title"><i class="fa-solid fa-store"></i> Quản Lý Gian Hàng</div>
    </div>

    <div class="container" style="padding: 15px;">
        <!-- Thông tin gian hàng -->
        <div class="shop-banner">
            <h2 id="shop-title-name">Gian Hàng Của Bạn</h2>
            <p style="font-size: 13px;">Chợ Nhanh Diễn Châu - Quản lý sản phẩm chuyên nghiệp</p>
        </div>

        <!-- Nút mở form đăng sản phẩm -->
        <div style="margin-bottom: 15px;">
            <button class="btn-primary" onclick="openPostModal()" style="width:100%; padding:12px; background:#ee4d2d; color:white; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer;">
                <i class="fa-solid fa-plus"></i> Đăng Sản Phẩm Mới (Chi Tiết)
            </button>
        </div>

        <h3 style="font-size: 15px; margin-bottom: 10px;">Sản phẩm trong gian hàng của bạn</h3>
        <!-- Danh sách sản phẩm của shop hiện tại -->
        <div class="product-grid" id="shop-product-list" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <!-- Sản phẩm được nạp tự động -->
        </div>
    </div>

    <!-- MODAL ĐĂNG SẢN PHẨM CHI TIẾT -->
    <div class="modal" id="post-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; justify-content:center; align-items:center; padding:15px; box-sizing:border-box; overflow-y:auto;">
        <div class="modal-content" style="background:white; width:100%; max-width:400px; border-radius:10px; padding:15px; position:relative; max-height:90vh; overflow-y:auto;">
            <span class="close-btn" onclick="closePostModal()" style="position:absolute; top:8px; right:12px; font-size:22px; cursor:pointer; color:#888;">&times;</span>
            <h3 style="color:#ee4d2d; margin-bottom:12px; text-align:center; font-size:16px;">Đăng Sản Phẩm Mới</h3>
            
            <div class="form-group">
                <label>Tên sản phẩm *</label>
                <input type="text" id="p-name" class="form-control" placeholder="Nhập tên sản phẩm...">
            </div>
            
            <div class="form-group">
                <label>Giá bán (VNĐ) *</label>
                <input type="number" id="p-price" class="form-control" placeholder="Nhập giá tiền...">
            </div>

            <div class="form-group">
                <label>Loại đồ / Danh mục</label>
                <select id="p-category" class="form-control">
                    <option value="Thời trang">👕 Thời trang</option>
                    <option value="Điện tử">📱 Điện tử</option>
                    <option value="Gia dụng">🏠 Gia dụng</option>
                    <option value="Đặc sản">🍲 Đặc sản</option>
                    <option value="Khác">📦 Khác</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kích thước / Size / Trọng lượng</label>
                <input type="text" id="p-size" class="form-control" placeholder="Ví dụ: Size L, 500g, Dài 20cm...">
            </div>

            <div class="form-group">
                <label>Mô tả chi tiết</label>
                <textarea id="p-desc" class="form-control" placeholder="Mô tả chất liệu, tình trạng, xuất xứ..."></textarea>
            </div>

            <div class="form-group">
                <label>Hình ảnh sản phẩm từ điện thoại *</label>
                <div class="upload-btn-wrapper">
                    <div class="btn-upload"><i class="fa-solid fa-camera"></i> Chọn ảnh sản phẩm</div>
                    <input type="file" id="p-file" accept="image/*" onchange="previewImage(event)">
                </div>
                <!-- Khung hiển thị xem trước ảnh -->
                <img id="img-preview" src="#" alt="Ảnh xem trước">
            </div>

            <button class="btn-primary" onclick="saveNewProduct()" style="width:100%; padding:10px; background:#ee4d2d; color:white; border:none; border-radius:6px; font-weight:bold; margin-top:5px; cursor:pointer;">Đăng Bài Lên Chợ Ngay</button>
        </div>
    </div>

    <!-- Thanh điều hướng dưới cùng -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Trang Chủ</span></a>
        <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span class="badge" id="cart-count">0</span><span>Giỏ Hàng</span></a>
        <a href="checkout.html" class="nav-item"><i class="fa-solid fa-box-archive"></i><span>Thanh Toán</span></a>
        <a href="shop.html" class="nav-item active"><i class="fa-solid fa-store"></i><span>Gian Hàng</span></a>
        <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Tôi</span></a>
    </div>
